name: Deploy to GitHub Pages

# Every push to main: guard → build → phone-size smoke test in WebKit → deploy.
# Any failing step blocks the deploy, so a leak or a broken page never reaches the site.
# Pages must be set to Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04 # pinned, so a runner-image upgrade is a deliberate change
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Re-runs the pre-commit guard. The private deny list comes from an Actions secret;
      # without it only the generic rules run (the guard says so in the log).
      - name: Guard — nothing private in a public repo
        run: node scripts/check-public.mjs
        env:
          PUBLIC_GUARD_DENY: ${{ secrets.PUBLIC_GUARD_DENY }}

      # The guard reads the strings inside .wasm files (a build can embed absolute source paths).
      # This plants one in a scratch checkout and fails if the scan misses it.
      - name: Guard self-test — the .wasm scan still finds a planted path
        run: node scripts/check-public.mjs --self-test

      # Sizes are rem so the whole UI follows --ui-scale; a raw px value would stay full-size.
      - name: Design system — rem, not px
        run: node scripts/check-units.mjs

      # Anything in Draw's public/library/ would be served as is (Draw has no library; the folder
      # stays absent): every .svg there must be inert (scripts/lib/svg-profile.mjs).
      - name: Served SVG must be inert (sources)
        run: node scripts/check-library.mjs

      # Core & Seams apps: every direct dependency is in the register and pinned; every action is registered.
      - name: Dependencies — registered and pinned (Core & Seams)
        run: node scripts/check-deps.mjs

      - name: Install dependencies
        run: npm ci

      # Core & Seams apps pin Rust in rust-toolchain.toml; rustup installs it on the first cargo call.
      # This makes that visible (and fails early) before the build.
      - name: Rust toolchains (Core & Seams apps)
        run: |
          for f in projects/*/rust-toolchain.toml; do
            [ -e "$f" ] || continue
            (cd "$(dirname "$f")" && echo "== $(dirname "$f")" && cargo --version && rustup target list --installed)
          done

      # Caches each Rust app's target/ and the cargo registry; add a line per app (new-app.mjs says so).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            projects/cs-probe -> target

      - name: Build every project and the launcher
        run: npm run build

      # Every .svg the site serves, from any project, can be opened as a document on the shared
      # origin, where its scripts would run. Checked on the built output, after every build step.
      - name: Served SVG — every .svg is inert (built site)
        run: node scripts/check-library.mjs --site _site

      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      # WebKit is Safari's engine; the cloud container only has Chromium, so this is the one
      # place Safari-engine rendering is checked before the phone.
      - name: Smoke test at phone size (WebKit)
        run: npm test
        env:
          ENGINE: webkit

      # Draw's support ledger cites e2e checks for the rows only a browser proves. Each cited check
      # must have passed in the run above (test/e2e.mjs records them), so WebKit is the evidence.
      - name: Ledger — every cited e2e check passed (WebKit)
        run: node projects/draw/tools/ledger-check.mjs --e2e-evidence .smoke/draw-e2e-evidence.jsonl

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04 # pinned, so a runner-image upgrade is a deliberate change
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
