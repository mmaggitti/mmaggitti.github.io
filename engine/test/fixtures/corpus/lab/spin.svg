<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="28" fill="none" stroke="#e9ecef" stroke-width="8"/>
  <circle
    cx="50"
    cy="50"
    r="28"
    fill="none"
    stroke="#e76f51"
    stroke-width="8"
    stroke-linecap="round"
    stroke-dasharray="60 116">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 50 50"
      to="360 50 50"
      dur="1s"
      repeatCount="indefinite"/>
  </circle>
</svg>
