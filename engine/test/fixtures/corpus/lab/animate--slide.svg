<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="20" cy="50" r="12" fill="#e9c46a">
    <animate
      attributeName="cx"
      values="20;80;20"
      dur="2s"
      calcMode="spline"
      keyTimes="0;0.5;1"
      keySplines=".5 0 .5 1;.5 0 .5 1"
      repeatCount="indefinite"/>
  </circle>
</svg>
