<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="chart-title" aria-describedby="chart-desc">
  <title id="chart-title">Monthly visitors</title>
  <desc id="chart-desc">Bar chart. Visitors rose from 40 in January to 88 in April.</desc>
  <line x1="10" y1="84" x2="92" y2="84" stroke="#264653"/>
  <rect x="16" y="52" width="12" height="32" fill="#2a9d8f"/>
  <text x="22" y="91" font-family="sans-serif" font-size="5" text-anchor="middle">Jan</text>
  <rect x="35" y="40" width="12" height="44" fill="#2a9d8f"/>
  <text x="41" y="91" font-family="sans-serif" font-size="5" text-anchor="middle">Feb</text>
  <rect x="54" y="28" width="12" height="56" fill="#2a9d8f"/>
  <text x="60" y="91" font-family="sans-serif" font-size="5" text-anchor="middle">Mar</text>
  <rect x="73" y="13.6" width="12" height="70.4" fill="#2a9d8f"/>
  <text x="79" y="91" font-family="sans-serif" font-size="5" text-anchor="middle">Apr</text>
</svg>
