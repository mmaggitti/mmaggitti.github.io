<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="1.5" result="fat"/>
      <feFlood flood-color="#e76f51" result="ink"/>
      <feComposite in="ink" in2="fat" operator="in" result="ring"/>
      <feComposite in="ring" in2="SourceAlpha" operator="out"/>
    </filter>
  </defs>
  <g filter="url(#outline)">
    <text x="50" y="62" font-family="sans-serif" font-size="34" font-weight="900" text-anchor="middle" fill="#264653">SVG</text>
  </g>
</svg>
