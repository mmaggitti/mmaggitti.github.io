<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="44" fill="#264653">
    <set attributeName="fill" to="#6d597a" begin="click"/>
  </circle>
  <path
    d="M 50 24 L 54.7 37.5 L 69 37.8 L 57.6 46.5 L 61.8 60.2 L 50 52 L 38.2 60.2 L 42.4 46.5 L 31 37.8 L 45.3 37.5 Z"
    fill="#e9c46a">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 50 44"
      to="360 50 44"
      dur="6s"
      repeatCount="indefinite"/>
  </path>
  <text id="note" x="50" y="82" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#e76f51">no script</text>
  <script>
    const note = document.getElementById('note');
