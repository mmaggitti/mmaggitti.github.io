<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 120">
  <defs>
    <path id="route" d="M20,90 C60,10 140,10 180,90" fill="none"/>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ecae6">
        <animate attributeName="stop-color" values="#8ecae6;#023047;#8ecae6" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="200" height="120" fill="url(#sky)"/>
  <use xlink:href="#route" stroke="#219ebc" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- follows the route, turning with it -->
  <g id="plane">
    <path d="M-8,-3 L8,0 L-8,3 L-5,0 Z" fill="#fb8500"/>
    <animateMotion id="fly" dur="4s" begin="0s;fly.end+1s" rotate="auto" fill="freeze" keyPoints="0;0.5;1" keyTimes="0;0.4;1" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1">
      <mpath xlink:href="#route"/>
    </animateMotion>
  </g>

  <circle cx="30" cy="30" r="8" fill="#ffb703">
    <animate attributeName="r" values="8;11;8" keyTimes="0; 0.5; 1" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="1" to="0.4" begin="fly.begin" dur="0.5s" fill="freeze"/>
  </circle>

  <rect x="150" y="20" width="24" height="24" rx="4" fill="#e76f51">
    <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 162 32" to="360 162 32" dur="3s" repeatCount="indefinite" additive="sum"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.1;1" dur="1.5s" repeatCount="indefinite" additive="sum"/>
    <set attributeName="fill" to="#2a9d8f" begin="click" dur="1s"/>
  </rect>

  <text x="100" y="112" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#023047" visibility="hidden">
    Landed
    <set attributeName="visibility" to="visible" begin="fly.end" end="fly.begin"/>
  </text>
</svg>
