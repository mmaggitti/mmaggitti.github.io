<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="240" height="160" viewBox="0 0 240 160" color-rendering="optimizeQuality">
  <!-- Presentation attributes SVG 1.1 exporters wrote and SVG 2 deprecated or removed. Browsers
       apply the ones they still support and ignore the rest. -->
  <svg x="8" y="8" width="104" height="64" viewBox="0 0 104 64" clip="rect(0, 104, 64, 0)" overflow="hidden">
    <rect width="104" height="64" fill="#e9c46a"/>
    <circle cx="84" cy="44" r="36" fill="#e76f51" color-rendering="optimizeSpeed"/>
  </svg>
  <text x="128" y="36" font-family="sans-serif" font-size="18" kerning="0" fill="#264653">Kerned</text>
  <text x="128" y="60" font-family="sans-serif" font-size="12" kerning="auto" glyph-orientation-horizontal="0deg" fill="#264653">Auto kerning</text>
  <text x="20" y="84" font-family="sans-serif" font-size="12" writing-mode="tb" glyph-orientation-vertical="0" fill="#2a9d8f">UPRIGHT</text>
  <switch>
    <g requiredFeatures="http://www.w3.org/TR/SVG11/feature#Shape http://www.w3.org/TR/SVG11/feature#BasicText">
      <rect x="128" y="96" width="96" height="48" rx="6" fill="#264653"/>
    </g>
    <text x="128" y="124" font-family="sans-serif" font-size="12">No SVG 1.1 shapes</text>
  </switch>
</svg>
