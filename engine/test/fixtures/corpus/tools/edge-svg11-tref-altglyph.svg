<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="240" height="120" viewBox="0 0 240 120">
  <!-- SVG 1.1 text by reference: tref shows the text of another element, and altGlyph asks for an
       alternate glyph. SVG 2 removed both; WebKit still draws them as plain text. -->
  <defs>
    <text id="product-name">Northwind</text>
    <altGlyphDef id="swash-N">
      <glyphRef glyphRef="N.swash" format="svg"/>
    </altGlyphDef>
  </defs>
  <rect width="240" height="120" fill="#f1faee"/>
  <text x="16" y="52" font-family="serif" font-size="30" fill="#1d3557"><altGlyph xlink:href="#swash-N">N</altGlyph>orthwind</text>
  <text x="16" y="92" font-family="sans-serif" font-size="16" fill="#457b9d">Made by <tref xlink:href="#product-name"/></text>
</svg>
