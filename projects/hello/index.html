<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover makes env(safe-area-inset-*) resolve to real values. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>
    // Re-apply this page's UI-scale preview before first paint, so it never flashes at the default.
    try { var s = localStorage.getItem('hello:ui-scale'); if (s) document.documentElement.style.setProperty('--ui-scale', s); } catch (e) {}
  </script>
  <meta name="theme-color" content="#F6F4EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
  <!-- "default", not "black-translucent": translucent leaves a dead band under the status bar. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="What this phone reports to a web page. Also proves the build and deploy pipeline.">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/ds/ds.css">
  <title>Hello — device check</title>
  <style>
    .scale { margin: var(--space-5) 0 0; }
    .scale .ds-muted { margin: 0 0 var(--space-2); }
    .count { text-align: center; margin: var(--space-6) 0 0; }
    .hint { text-align: center; margin: 0; }
    /* Probe element: lets JS read what env(safe-area-inset-*) resolves to. */
    #probe {
      position: fixed; visibility: hidden; pointer-events: none;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
  </style>
</head>
<body>
  <div class="ds-app">
    <main class="ds-page">
      <h1 class="ds-title">Hello</h1>
      <p class="ds-sub">What this phone reports to a web page.</p>
      <dl class="ds-list" id="facts"></dl>
      <div class="scale">
        <p class="ds-muted ds-small" id="scale-label">Preview UI scale (this page only; site default 75%)</p>
        <div class="ds-seg" id="seg" role="group" aria-labelledby="scale-label"></div>
      </div>
      <p class="ds-display count" id="count" aria-live="polite">0</p>
      <p class="ds-muted ds-small hint">Taps, saved on this device only.</p>
    </main>
    <div class="ds-bar">
      <button class="ds-btn" id="reset" type="button">Reset</button>
      <button class="ds-btn ds-btn--primary" id="tap" type="button">Tap</button>
    </div>
  </div>
  <div id="probe"></div>

  <script type="module">
    // Every project shares the mmaggitti.github.io origin, so storage keys carry the project name.
    const store = {
      get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
      set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* private mode / storage blocked */ } },
    };

    let taps = Number(store.get('hello:taps')) || 0;
    const countEl = document.getElementById('count');
    const render = () => { countEl.textContent = taps; };
    document.getElementById('tap').addEventListener('click', () => { taps++; store.set('hello:taps', String(taps)); render(); });
    document.getElementById('reset').addEventListener('click', () => { taps = 0; store.set('hello:taps', '0'); render(); });
    render();

    // UI-scale preview: --ui-scale sets the root font size, and every rem in ds.css follows it.
    const root = document.documentElement;
    const scaleNow = () => Number(getComputedStyle(root).getPropertyValue('--ui-scale'));
    const seg = document.getElementById('seg');
    const options = [1, 0.85, 0.75, 0.667];
    function renderSeg() {
      const now = scaleNow();
      seg.replaceChildren(...options.map((s) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = `${Math.round(s * 100)}%`;
        b.setAttribute('aria-pressed', String(Math.abs(s - now) < 0.001));
        b.addEventListener('click', () => {
          root.style.setProperty('--ui-scale', String(s));
          store.set('hello:ui-scale', String(s));
          renderSeg();
          renderFacts();
        });
        return b;
      }));
    }

    const mq = (q) => matchMedia(q).matches;
    function facts() {
      const s = getComputedStyle(document.getElementById('probe'));
      const inset = ['Top', 'Right', 'Bottom', 'Left'].map((k) => parseFloat(s[`padding${k}`]) || 0).join(' / ');
      return [
        ['Viewport', `${innerWidth} × ${innerHeight}`],
        ['Screen', `${screen.width} × ${screen.height} @${devicePixelRatio}x`],
        ['UI scale', `${Math.round(scaleNow() * 100)}% (1rem = ${parseFloat(getComputedStyle(root).fontSize)}px)`],
        ['Safe area (t/r/b/l)', inset],
        ['Opened as', mq('(display-mode: standalone)') || navigator.standalone ? 'Home Screen app' : 'browser tab'],
        ['Color scheme', mq('(prefers-color-scheme: dark)') ? 'dark' : 'light'],
        ['Reduced motion', mq('(prefers-reduced-motion: reduce)') ? 'on' : 'off'],
        ['Touch points', navigator.maxTouchPoints],
        ['Online', navigator.onLine ? 'yes' : 'no'],
      ];
    }
    function renderFacts() {
      document.getElementById('facts').replaceChildren(...facts().map(([k, v]) => {
        const row = document.createElement('div');
        row.className = 'ds-row';
        const dt = document.createElement('dt');
        const dd = document.createElement('dd');
        dt.textContent = k;
        dd.textContent = v;
        row.append(dt, dd);
        return row;
      }));
    }
    renderSeg();
    renderFacts();
    addEventListener('resize', renderFacts);
    addEventListener('online', renderFacts);
    addEventListener('offline', renderFacts);
  </script>
</body>
</html>
