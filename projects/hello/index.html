<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover makes env(safe-area-inset-*) resolve to real values. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F4EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
  <!-- "default", not "black-translucent": translucent leaves a dead band under the status bar. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="What this phone reports to a web page. Also proves the build and deploy pipeline.">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Hello — device check</title>
  <style>
    :root { --bg: #F6F4EE; --card: #FFFFFF; --text: #1B1B1B; --muted: #5E5A52; --line: #E3DED3; --accent: #233044; --on-accent: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111111; --card: #1C1C1E; --text: #F2F2F2; --muted: #A5A5AA; --line: #2C2C2E; --accent: #9DB4D6; --on-accent: #111111; }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    /* svh, never vh: the collapsing address bar makes vh jump mid-scroll. */
    .app {
      min-height: 100svh; display: flex; flex-direction: column;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
    }
    main { flex: 1; width: 100%; max-width: 560px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 28px; line-height: 1.2; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 20px; }
    dl { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
    .row:first-child { border-top: 0; }
    dt { color: var(--muted); }
    dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .count { font-size: 56px; font-weight: 700; text-align: center; margin: 24px 0 0; font-variant-numeric: tabular-nums; }
    .hint { color: var(--muted); text-align: center; margin: 0; font-size: 15px; }
    /* Actions live in the thumb zone, clear of the home indicator. */
    .bar {
      position: sticky; bottom: 0; display: flex; gap: 12px; width: 100%; max-width: 560px; margin: 0 auto;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--bg);
    }
    button {
      flex: 1; min-height: 52px; border-radius: 14px; font: inherit; font-weight: 600;
      border: 1px solid var(--line); background: var(--card); color: var(--text);
      touch-action: manipulation; /* no double-tap zoom delay */
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    button:active { transform: scale(0.98); }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { button:active { transform: none; } }
    /* Probe element: lets JS read what env(safe-area-inset-*) resolves to. */
    #probe {
      position: fixed; visibility: hidden; pointer-events: none;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
  </style>
</head>
<body>
  <div class="app">
    <main>
      <h1>Hello</h1>
      <p class="sub">What this phone reports to a web page.</p>
      <dl id="facts"></dl>
      <p class="count" id="count" aria-live="polite">0</p>
      <p class="hint">Taps, saved on this device only.</p>
    </main>
    <div class="bar">
      <button id="reset" type="button">Reset</button>
      <button id="tap" type="button" class="primary">Tap</button>
    </div>
  </div>
  <div id="probe"></div>

  <script type="module">
    // Every project shares the mmaggitti.github.io origin, so storage keys carry the project name.
    const KEY = 'hello:taps';
    const load = () => {
      try { return Number(localStorage.getItem(KEY)) || 0; } catch { return 0; }
    };
    const save = (n) => {
      try { localStorage.setItem(KEY, String(n)); } catch { /* private mode / storage blocked */ }
    };

    let taps = load();
    const countEl = document.getElementById('count');
    const render = () => { countEl.textContent = taps; };
    document.getElementById('tap').addEventListener('click', () => { taps++; save(taps); render(); });
    document.getElementById('reset').addEventListener('click', () => { taps = 0; save(taps); render(); });
    render();

    const mq = (q) => matchMedia(q).matches;
    function facts() {
      const s = getComputedStyle(document.getElementById('probe'));
      const inset = ['Top', 'Right', 'Bottom', 'Left'].map((k) => parseFloat(s[`padding${k}`]) || 0).join(' / ');
      return [
        ['Viewport', `${innerWidth} × ${innerHeight}`],
        ['Screen', `${screen.width} × ${screen.height} @${devicePixelRatio}x`],
        ['Safe area (t/r/b/l)', inset],
        ['Opened as', mq('(display-mode: standalone)') || navigator.standalone ? 'Home Screen app' : 'browser tab'],
        ['Color scheme', mq('(prefers-color-scheme: dark)') ? 'dark' : 'light'],
        ['Reduced motion', mq('(prefers-reduced-motion: reduce)') ? 'on' : 'off'],
        ['Touch points', navigator.maxTouchPoints],
        ['Online', navigator.onLine ? 'yes' : 'no'],
      ];
    }
    function renderFacts() {
      const dl = document.getElementById('facts');
      dl.replaceChildren(...facts().map(([k, v]) => {
        const row = document.createElement('div');
        row.className = 'row';
        const dt = document.createElement('dt');
        const dd = document.createElement('dd');
        dt.textContent = k;
        dd.textContent = v;
        row.append(dt, dd);
        return row;
      }));
    }
    renderFacts();
    addEventListener('resize', renderFacts);
    addEventListener('online', renderFacts);
    addEventListener('offline', renderFacts);
  </script>
</body>
</html>
