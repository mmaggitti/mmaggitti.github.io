  <rect x="17" y="8" width="16" height="48" rx="8" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="5"/>
  <rect x="39" y="22" width="9" height="34" rx="4.5" fill="#fff" fill-opacity=".45"/>
  <rect x="12" y="33" width="26" height="8" rx="3" fill="#fff"/>
</svg>
