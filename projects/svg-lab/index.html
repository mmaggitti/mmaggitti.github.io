<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e4e6ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#27282c" media="(prefers-color-scheme: dark)">
<!-- "default", not "black-translucent": translucent leaves a dead band under the status bar. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="28 hands-on SVG lessons in five sets, plus a sandbox. Drag the numbers in the code and watch the drawing change.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>SVG Lab</title>
<!-- The site design system: --ui-scale (the 0.75 root size every rem follows), --tap-min and
     reduced motion. The lab's own colors and type follow in the <style> below and win. -->
<link rel="stylesheet" href="/ds/ds.css">
<script src="vendor/purify.min.js"></script>
<style>
/* Self-hosted (OFL, licenses beside the files): no third-party request. Archivo is the variable
   cut with both axes, because the headings use font-stretch. */
@font-face{font-family:"Archivo";src:url(fonts/archivo-latin-wdth.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url(fonts/ibm-plex-mono-latin-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url(fonts/ibm-plex-mono-latin-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url(fonts/ibm-plex-mono-latin-600.woff2) format("woff2");font-weight:600;font-display:swap}
:root{
  box-sizing:border-box;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paste:#e4e6ea;--paste-2:#d6d9de;--chip:#f3f4f6;--ink:#231f20;--ink-2:#44464b;--muted:#5d6066;--line:#c4c8ce;
  --cyan:#00a3e0;--magenta:#e6007e;--yellow:#ffe600;
  --panel:#f7f8f9;--panel-line:#d2d6db;
  --t-tag:#231f20;--t-attr:#5d6066;--t-p:#979ba2;--t-val:#2f4858;--t-cm:#83878e;
  --t-num:#c4006b;--t-num-bg:#fce4f0;--t-num-ul:rgba(196,0,107,.5);
  --t-en:#00709b;--t-en-bg:#dff3fb;--t-en-ul:rgba(0,112,155,.45);
  --t-str:#231f20;--t-str-bg:#fff4a3;
  --fl:rgba(255,230,0,.8);
  --mark:rgba(35,31,32,.5);
  --board-shadow:0 0 0 1px rgba(35,31,32,.07),0 1px 3px rgba(35,31,32,.16);
  --ui:"Archivo","Helvetica Neue",Arial,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --hh:calc(var(--tap-min) + 1.25rem + 1px); /* until JS measures #top */
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paste:#27282c;--paste-2:#34363b;--chip:#303237;--ink:#ededee;--ink-2:#cfd0d3;--muted:#a3a6ac;--line:#4a4c52;
    --cyan:#1db5ee;--magenta:#ff4aa5;
    --panel:#2e3035;--panel-line:#44464c;
    --t-tag:#f2f2f3;--t-attr:#a3a7ae;--t-p:#767a81;--t-val:#bcd0de;--t-cm:#8d9198;
    --t-num:#ff79bb;--t-num-bg:rgba(255,121,187,.14);--t-num-ul:rgba(255,121,187,.55);
    --t-en:#5ccbf3;--t-en-bg:rgba(92,203,243,.13);--t-en-ul:rgba(92,203,243,.5);
    --t-str:#fff2a0;--t-str-bg:rgba(255,230,0,.16);
    --fl:rgba(255,230,0,.45);
    --mark:rgba(237,237,238,.45);
    --board-shadow:0 0 0 1px rgba(0,0,0,.45),0 .5rem 1.5rem rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paste:#27282c;--paste-2:#34363b;--chip:#303237;--ink:#ededee;--ink-2:#cfd0d3;--muted:#a3a6ac;--line:#4a4c52;
  --cyan:#1db5ee;--magenta:#ff4aa5;
  --panel:#2e3035;--panel-line:#44464c;
  --t-tag:#f2f2f3;--t-attr:#a3a7ae;--t-p:#767a81;--t-val:#bcd0de;--t-cm:#8d9198;
  --t-num:#ff79bb;--t-num-bg:rgba(255,121,187,.14);--t-num-ul:rgba(255,121,187,.55);
  --t-en:#5ccbf3;--t-en-bg:rgba(92,203,243,.13);--t-en-ul:rgba(92,203,243,.5);
  --t-str:#fff2a0;--t-str-bg:rgba(255,230,0,.16);
  --fl:rgba(255,230,0,.45);
  --mark:rgba(237,237,238,.45);
  --board-shadow:0 0 0 1px rgba(0,0,0,.45),0 .5rem 1.5rem rgba(0,0,0,.35);
  color-scheme:dark;
}
html{scroll-padding-top:var(--hh);background:var(--paste);-webkit-text-size-adjust:100%;text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paste);color:var(--ink);font:400 var(--text-md)/1.4 var(--ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,pre.src,a.chip,label.chip{touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
body.scrubbing,body.scrubbing *{cursor:ew-resize!important;user-select:none;-webkit-user-select:none}

/* header */
.top{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:30;background:var(--paste);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:.75rem;max-width:77.5rem;margin:0 auto;padding:.5rem 0 .5rem .875rem}
.brand{display:flex;align-items:center;gap:.4375rem;flex:none;font-weight:800;font-stretch:112%;font-size:1.0625rem;letter-spacing:-.01em}
.brand svg{width:1.375rem;height:1.375rem;flex:none}
.tabs{position:relative;display:flex;gap:.375rem;overflow-x:auto;scrollbar-width:none;padding:.125rem .875rem .125rem .125rem;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 1.625rem),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 1.625rem),transparent)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:.375rem;height:max(var(--tap-min),2.25rem);padding:0 .8125rem;border-radius:999rem;border:1px solid var(--line);background:var(--chip);font-weight:600;font-size:var(--text-sm);white-space:nowrap}
.tab .n{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500}
.tab[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--paste)}
.tab[aria-current="true"] .n{color:inherit;opacity:.6}
.tab.done::after{content:"";width:.5rem;height:.28125rem;border:solid currentColor;border-width:0 0 .125rem .125rem;transform:translateY(-.125rem) rotate(-45deg);margin-left:.0625rem}

/* sets */
.setbtn{flex:none;display:inline-flex;align-items:center;gap:.25rem;height:max(var(--tap-min),2.25rem);padding:0 .5rem 0 .6875rem;margin-right:-.25rem;border-radius:.625rem;border:.09375rem solid var(--ink);background:var(--paste);font-weight:700;font-size:var(--text-sm);white-space:nowrap}
.setbtn svg{width:.9375rem;height:.9375rem;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:35rem){.brand .bt{display:none}.top-in{gap:.625rem}}
.tab .ic{width:1rem;height:1rem;margin-left:-.125rem}
.sets{display:flex;flex-direction:column;gap:.5rem;padding-bottom:.375rem}
.setrow{display:flex;align-items:center;gap:.875rem;text-align:left;padding:.75rem .875rem;border-radius:.875rem;border:1px solid var(--line);background:var(--chip)}
.setrow[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.setrow b{font-weight:800;font-stretch:125%;font-size:1.625rem;line-height:1;min-width:1.1em}
.setrow strong{display:block;font-size:1rem}
.setrow small{display:block;color:var(--muted);font-size:var(--text-sm);margin-top:.125rem}
/* set 2 guides */
.ghost{fill:none;stroke:#00a3e0;stroke-width:1.5;stroke-dasharray:5 4;opacity:.75}
#gGuide .hit{pointer-events:stroke;cursor:pointer}
.fl{font-family:var(--mono);font-weight:600;fill:#006f99;paint-order:stroke;stroke:#fff;stroke-linejoin:round}
.fl.on{fill:#e6007e}
.refl{fill:#fff;stroke:#e6007e;stroke-width:1.5;stroke-dasharray:2.5 2}
.armd{fill:none;stroke:#e6007e;stroke-width:1;stroke-dasharray:3 3;opacity:.75}
.dir{fill:#00a3e0}.dir.in{fill:#e6007e}
.tl{fill:none;stroke:#e6007e;stroke-width:1;stroke-dasharray:3 3;opacity:.8}
.bb{fill:none;stroke:#8d99ae;stroke-width:1;stroke-dasharray:2 3}
.bbl{font-family:var(--mono);fill:#6b7280;paint-order:stroke;stroke:#fff;stroke-linejoin:round}

/* set 3 */
.stage-box.is-duo2{aspect-ratio:auto;width:min(100% - 1.625rem,40rem)}
.stage-box.is-duo2::before,.stage-box.is-duo2 .board,.stage-box.is-duo2 #duo{display:none}
.stage-box.is-duo2 #duo2{display:grid;grid-template-columns:1fr 1fr;gap:.875rem}
.pane img{position:absolute;inset:0;width:100%;height:100%;display:block}
#duo2 .pane{cursor:default}
#stage.hold *{animation-play-state:paused!important}
.linkbar{display:flex;align-items:center;gap:.625rem;flex-wrap:wrap;width:100%;font-size:var(--text-sm);line-height:1.35}
.linkbar span{flex:1 1 12.5rem;min-width:0;overflow-wrap:anywhere}
.linkbar a.chip{text-decoration:none;color:inherit}

/* set 4: filter step strip */
.ctx:not(:empty){display:flex;width:min(100%,35rem);margin:.125rem auto .375rem}
.chain{display:flex;align-items:center;gap:.1875rem;overflow-x:auto;scrollbar-width:none;padding:.125rem .125rem .25rem;width:100%}
.chain::-webkit-scrollbar{display:none}
.step{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:var(--tap-min);min-height:var(--tap-min);gap:.1875rem;padding:.25rem .25rem .1875rem;border-radius:.625rem;border:1px solid var(--line);background:var(--chip);font:600 var(--text-sm)/1.1 var(--ui);color:var(--ink)}
.step svg{width:3rem;height:3rem;background:repeating-conic-gradient(#e3e6ea 0 25%,#fff 0 50%) 0 0/.5rem .5rem;border-radius:.25rem;display:block}
.stage-box.peek .board{background:repeating-conic-gradient(#e3e6ea 0 25%,#fff 0 50%) 0 0/1rem 1rem}
.step[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chain .arr{flex:none;width:.4375rem;height:.4375rem;border-top:.09375rem solid var(--muted);border-right:.09375rem solid var(--muted);transform:rotate(45deg);margin:0 .1875rem 1rem .0625rem}

/* set 5 */
.code .vs.long{display:inline-block;max-width:15ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.filepick{position:relative;overflow:hidden}
.filepick input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* layout */
main{max-width:77.5rem;margin:0 auto}
.intro{padding:1.125rem 1rem .125rem;max-width:47.5rem;margin:0 auto}
.intro h1{margin:0;font-weight:800;font-stretch:125%;font-size:clamp(1.625rem,calc(7.4vw * var(--ui-scale)),2.375rem);line-height:1.02;letter-spacing:-.012em}
.intro p{margin:.4375rem 0 0;color:var(--muted);font-size:1.03125rem;max-width:34em}
.stage-wrap{position:sticky;top:var(--hh);z-index:10;background:var(--paste);padding:.25rem .75rem .375rem}
.stage-wrap::after{content:"";position:absolute;left:0;right:0;bottom:-.625rem;height:.625rem;background:linear-gradient(var(--paste),rgba(0,0,0,0));pointer-events:none}
.stage-box{position:relative;margin:.8125rem auto;width:min(100% - 1.625rem,47vh,32.5rem);width:min(100% - 1.625rem,47svh,32.5rem);aspect-ratio:1/1}
.stage-box::before{content:"";position:absolute;inset:-.75rem;pointer-events:none;background:
  linear-gradient(var(--mark),var(--mark)) left 0 top .75rem/.5rem 1px no-repeat,
  linear-gradient(var(--mark),var(--mark)) left .75rem top 0/1px .5rem no-repeat,
  linear-gradient(var(--mark),var(--mark)) right 0 top .75rem/.5rem 1px no-repeat,
  linear-gradient(var(--mark),var(--mark)) right .75rem top 0/1px .5rem no-repeat,
  linear-gradient(var(--mark),var(--mark)) left 0 bottom .75rem/.5rem 1px no-repeat,
  linear-gradient(var(--mark),var(--mark)) left .75rem bottom 0/1px .5rem no-repeat,
  linear-gradient(var(--mark),var(--mark)) right 0 bottom .75rem/.5rem 1px no-repeat,
  linear-gradient(var(--mark),var(--mark)) right .75rem bottom 0/1px .5rem no-repeat}
.board{position:absolute;inset:0;background:#fff;border-radius:1px;box-shadow:var(--board-shadow);overflow:hidden}
#stage{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#gGrid,#gGuide,#gHnd{pointer-events:none}
.side{padding:.375rem .875rem 2.125rem;max-width:47.5rem;margin:0 auto}

/* artboard vocabulary (the board is white in both themes) */
.g1{stroke:#a4dded;stroke-width:1;opacity:.6}
.g2{stroke:#a4dded;stroke-width:1}
.gl{fill:#3f8fb8;font-family:var(--ui);font-weight:600;font-variant-numeric:tabular-nums;paint-order:stroke;stroke:#fff;stroke-linejoin:round}
.gd{fill:none;stroke:#00a3e0;stroke-width:1.25;stroke-dasharray:5 4}
.gt{fill:#006f99;font-family:var(--ui);font-weight:700;font-variant-numeric:tabular-nums;paint-order:stroke;stroke:#fff;stroke-linejoin:round}
.arm{fill:none;stroke:#e6007e;stroke-width:1;opacity:.75}
.lg{stroke:#e6007e;stroke-width:1;opacity:.22}
.ax{stroke:#e6007e;stroke-width:1.5}
.axl{fill:#e6007e;font-family:var(--ui);font-weight:700}
.selbox{fill:none;stroke:#00a3e0;stroke-width:1;stroke-dasharray:4 3}
.empty{fill:#83878e;font-family:var(--ui);font-weight:500}
.hd{fill:#fff;stroke:#00a3e0;stroke-width:2}
.hd.start{fill:#00a3e0;stroke:#fff;stroke-width:1.5}
.hd.ctrl{fill:#e6007e;stroke:#fff;stroke-width:1.5}
.hd.bend{fill:#fff;stroke:#00a3e0;stroke-width:1.5;opacity:.8}
.hd.rot,.hd.scale{stroke:#e6007e}
.hd.on{fill:#ffe600}
.hd-dot{fill:#00a3e0}

/* tooltip */
.tip{position:absolute;left:0;top:0;z-index:5;background:#231f20;color:#fff;font:600 var(--text-sm)/1 var(--ui);font-variant-numeric:tabular-nums;padding:.4375rem .625rem;border-radius:.5rem;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.tip{transform:translate(-50%,calc(-100% - 42px))} /* px-ok: clears the fingertip */
.tip.below{transform:translate(-50%,40px)} /* px-ok: clears the fingertip */

/* pixels vs vector */
.duo{display:none}
.stage-box.is-duo{aspect-ratio:auto;width:min(100% - 1.625rem,40rem)}
.stage-box.is-duo::before,.stage-box.is-duo .board{display:none}
.stage-box.is-duo .duo{display:grid;grid-template-columns:1fr 1fr;gap:.875rem}
.duo figure{margin:0;min-width:0}
.pane{position:relative;aspect-ratio:1/1;background:#fff;box-shadow:var(--board-shadow);overflow:hidden;touch-action:none;cursor:grab}
.pane canvas,.pane svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.duo figcaption{margin-top:.5rem;font-size:var(--text-sm);color:var(--muted);line-height:1.3}
.duo figcaption b{display:block;color:var(--ink);font-weight:700;font-size:.9375rem}

/* controls */
.ctrls{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.25rem 0 .75rem}
.ctrls:empty{display:none}
.grp{display:inline-flex;flex-wrap:wrap;gap:.375rem;align-items:center}
.lbl{font-size:var(--text-sm);font-weight:600;color:var(--muted);margin:0 .125rem 0 .25rem}
.chip{height:max(var(--tap-min),2.5rem);min-width:var(--tap-min);justify-content:center;padding:0 .8125rem;border-radius:999rem;border:1px solid var(--line);background:var(--chip);font-weight:600;font-size:.9375rem;display:inline-flex;align-items:center;gap:.375rem;white-space:nowrap}
.chip.mono{font-family:var(--mono);font-weight:500;font-size:var(--text-sm)}
.chip[aria-pressed="true"],.chip.primary{background:var(--ink);border-color:var(--ink);color:var(--paste)}
.slide{display:flex;align-items:center;gap:.625rem;flex:1 1 14.375rem;min-width:13.125rem;min-height:max(var(--tap-min),2.5rem)}
.slide label{font-weight:600}
.slide b{font-variant-numeric:tabular-nums;min-width:2.8em;text-align:right;font-weight:600}
input[type=range]{flex:1;min-width:0;accent-color:var(--ink);height:max(var(--tap-min),2rem);margin:0}

/* goals */
.goals{display:flex;flex-wrap:wrap;gap:.375rem;margin:0 0 .875rem}
.goals:empty{display:none}
.goal{display:inline-flex;align-items:center;gap:.4375rem;height:2rem;padding:0 .75rem 0 .5625rem;border-radius:999rem;border:1px dashed var(--muted);color:var(--ink-2);font-size:var(--text-sm);font-weight:500}
.goal i{position:relative;width:.875rem;height:.875rem;border:.09375rem solid currentColor;border-radius:2px;flex:none}
.goal.ok{border-style:solid;border-color:var(--ink);color:var(--ink)}
.goal.ok i{background:var(--ink);border-color:var(--ink)}
.goal.ok i::after{content:"";position:absolute;left:.21875rem;top:.03125rem;width:.21875rem;height:.4375rem;border:solid var(--paste);border-width:0 .125rem .125rem 0;transform:rotate(45deg)}
.goal.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.88)}60%{transform:scale(1.07)}100%{transform:none}}

/* code panel */
.code{background:var(--panel);border:1px solid var(--panel-line);border-radius:.625rem}
.code-head{display:flex;flex-wrap:wrap;align-items:center;gap:.375rem .5rem;padding:.4375rem .4375rem .4375rem .75rem;border-bottom:1px solid var(--panel-line)}
.legend{flex:1 1 10.625rem;display:flex;flex-wrap:wrap;align-items:center;gap:.25rem .75rem;font-size:var(--text-sm);color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:.25rem}
.legend .tk{cursor:default;font-size:var(--text-sm)}
.cbtn{height:max(var(--tap-min),2.125rem);padding:0 .8125rem;border-radius:.5rem;border:1px solid var(--panel-line);background:transparent;font-weight:600;font-size:var(--text-sm)}
/* Code rows keep ~24px pitch and ~20px tokens at the 0.75 scale: tokens are the main drag/tap
   targets, under 44pt by necessity (the Sheet they open has full-size controls). */
pre.src{margin:0;padding:.75rem .875rem 1.125rem;font:400 var(--text-sm)/2.1 var(--mono);color:var(--t-val);white-space:pre-wrap;overflow-wrap:anywhere;tab-size:2}
.tg{color:var(--t-tag);font-weight:600}
.an{color:var(--t-attr)}
.pu{color:var(--t-p)}
.vs{color:var(--t-val)}
.cm,.cm .vs{color:var(--t-cm);font-style:italic}
.tk{display:inline-block;line-height:1.8;padding:0 .1875rem;margin:0 .0625rem;border-radius:.25rem;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer;font-style:normal}
.tk.num{color:var(--t-num);background:var(--t-num-bg);box-shadow:inset 0 -.125rem 0 var(--t-num-ul);touch-action:pan-y;cursor:ew-resize;font-weight:500}
.tk.num.ro{color:var(--t-val);background:none;box-shadow:none;cursor:text;padding:0;margin:0;font-weight:400;user-select:text;-webkit-user-select:text}
.tk.en{color:var(--t-en);background:var(--t-en-bg);box-shadow:inset 0 -.125rem 0 var(--t-en-ul);font-weight:500}
.tk.col{color:var(--t-tag);background:var(--t-num-bg);background:color-mix(in srgb,var(--t-tag) 7%,transparent)}
.tk.col i{display:inline-block;width:.6875rem;height:.6875rem;margin-right:.3125rem;border-radius:2px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);vertical-align:-.0625rem}
.tk.col.none i{background:linear-gradient(to top right,transparent calc(50% - .0625rem),#e6007e calc(50% - .0625rem),#e6007e calc(50% + .0625rem),transparent calc(50% + .0625rem)),#fff}
.tk.str{color:var(--t-str);background:var(--t-str-bg)}
.tk.act{outline:2px solid var(--t-num);outline-offset:1px}
.blk{display:block}
.hl{display:inline-block;vertical-align:top}
.at{display:inline-block;vertical-align:top}
.at,.tk{text-indent:0}
.blk[data-i]{cursor:pointer;margin:0 -.875rem;padding:0 .875rem}
.blk.sel{background:rgba(0,163,224,.1);box-shadow:inset 3px 0 0 var(--cyan)}
.next{display:block;width:100%;height:max(var(--tap-min),3.25rem);margin-top:1.125rem;border:0;border-radius:.75rem;background:var(--ink);color:var(--paste);font-weight:700;font-size:1.03125rem;font-stretch:108%}

/* create: tools under the artboard, overlay buttons on it */
.ctx{display:none}
body[data-lab="create"] .ctx{display:flex;gap:.375rem;width:min(100%,35rem);margin:0 auto .25rem;overflow-x:auto;scrollbar-width:none;padding:.0625rem}
.ctx::-webkit-scrollbar{display:none}

.tool .dot{width:1.125rem;height:1.125rem;border-radius:.25rem;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.22)}
.tool .dot.ring{background:transparent;box-shadow:inset 0 0 0 .25rem var(--c),inset 0 0 0 .3125rem rgba(0,0,0,.18)}
.tool .dot.none{background:linear-gradient(to top right,transparent calc(50% - .0625rem),#e6007e calc(50% - .0625rem),#e6007e calc(50% + .0625rem),transparent calc(50% + .0625rem)),#fff}
.pen-hint{align-self:center;flex:none;font-size:var(--text-sm);font-weight:600;color:var(--muted);padding:0 .375rem 0 .125rem}
.ic{width:1.375rem;height:1.375rem;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.over{position:absolute;bottom:.5rem;right:.5rem;z-index:4;display:flex;gap:.375rem}
.obtn{width:max(var(--tap-min),2.25rem);height:max(var(--tap-min),2.25rem);display:grid;place-items:center;border-radius:.5rem;border:1px solid rgba(35,31,32,.14);background:rgba(255,255,255,.92);color:#231f20;padding:0}
.obtn .ic{width:1.25rem;height:1.25rem}
.obtn:disabled{opacity:.3}
.obtn[aria-pressed="true"]{background:#231f20;color:#fff;border-color:#231f20}

/* bottom sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(35,31,32,.16);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}

.sheet.on{transform:none;visibility:visible;transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.sh-grab{width:2.25rem;height:.25rem;border-radius:2px;background:var(--line);margin:0 auto .625rem}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:.625rem;margin-bottom:.875rem;min-height:2.25rem}
.sh-head b{font:600 .9375rem var(--mono)}
.sh-done{height:max(var(--tap-min),2.25rem);padding:0 1.125rem;border-radius:999rem;border:0;background:var(--ink);color:var(--paste);font-weight:700}
.stepper{display:grid;grid-template-columns:max(var(--tap-min),3.625rem) 1fr max(var(--tap-min),3.625rem);gap:.5rem}
.stp{height:max(var(--tap-min),3.375rem);border-radius:.75rem;border:1px solid var(--line);background:var(--paste);font-size:1.625rem;font-weight:500;line-height:1}

.sh-num input[type=range]{width:100%;margin-top:.875rem}
.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(max(var(--tap-min),calc((100% - 7 * .5rem) / 8)),1fr));gap:.5rem}
.sw{aspect-ratio:1/1;min-height:var(--tap-min);border-radius:.375rem;border:0;padding:0;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.16)}

.sh-row{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.875rem;align-items:center}
.sh-row .chip.on{box-shadow:0 0 0 .125rem var(--chip),0 0 0 .25rem var(--ink)}
.custom input{width:1.625rem;height:1.625rem;border:0;padding:0;background:none;border-radius:.25rem}
.sh-w{display:flex;align-items:center;gap:.625rem;margin-top:1rem;font:500 var(--text-sm) var(--mono)}
.sh-w b{min-width:2ch;text-align:right;font-weight:600}
.sh-text input{width:100%;height:max(var(--tap-min),3.375rem);border-radius:.75rem;border:1px solid var(--line);background:var(--paste);color:var(--ink);padding:0 .875rem;font:500 1.125rem var(--ui)}

const LANGS = Array.from(new Set(['fr', 'es', 'ja', 'de', 'en', 'zh'].concat(userLangs())));
const word = (t) => WORDS[t] || WORDS[String(t).split('-')[0].toLowerCase()] || t;
const WORDS = { fr: 'Bonjour', es: 'Hola', ja: 'こんにちは', de: 'Hallo', en: 'Hello', zh: '你好' };
const LabSwitch = {
  id: 'switch', tab: 'Switch', title: 'Switch and unknown tags', hint: '', mode: 'lang',
  langs: ['fr', 'es', 'ja'], tag: 'sparkle', shown: -1, changed: false, renamed: false, met: false,
  enter(c) { this.c = c; this.controls(); },
  controls() {
    let h = modeChips([['lang', 'Language sign'], ['unknown', 'Unknown tag']], this.mode, 'm');
    if (this.mode === 'unknown') h += `<button class="chip" data-a="rename" aria-pressed="${this.tag === 'g'}">Rename to &lt;g&gt;</button>`;
    this.c.innerHTML = h;
    this.c.onclick = (e) => {
      const b = e.target.closest('[data-m],[data-a]'); if (!b) return;
      if (b.dataset.m) { this.mode = b.dataset.m; if (this.mode === 'unknown') this.met = true; } else { this.tag = this.tag === 'g' ? 'sparkle' : 'g'; if (this.tag === 'g') this.renamed = true; }
      this.controls(); App.render();
    };
    $('#hint').textContent = this.mode === 'lang' ? '<switch> draws the first child whose conditions pass. systemLanguage compares each tag with your browser’s languages.' : 'The spec calls tags it doesn’t define “unknown” elements. You never write <unknown> itself.';
  },
  nodes() {
    const T = (a, t) => el('text', a.concat([['x', '50'], ['y', '55'], ['font-family', 'sans-serif'], ['font-size', '13'], ['font-weight', '700'], ['text-anchor', 'middle'], ['fill', '#f1faee']]), null, { text: t, inline: true });
    if (this.mode === 'lang') {
      return [el('rect', [['x', '8'], ['y', '32'], ['width', '84'], ['height', '36'], ['rx', '8'], ['fill', '#264653']], null, { inline: true }),
        el('switch', [], this.langs.map((l, i) => T([['systemLanguage', en('l' + i, l, LANGS)]], word(l))).concat([T([], 'Welcome')]))];
    }
    return [{ comment: [tx(this.tag === 'g' ? 'renamed to g, so everything inside is drawn' : 'sparkle is not an SVG tag')] },
      el(this.tag, [], [el('circle', [['cx', '50'], ['cy', '46'], ['r', '22'], ['fill', '#e76f51']], null, { inline: true }),
        el('text', [['x', '50'], ['y', '84'], ['font-family', 'sans-serif'], ['font-size', '8'], ['text-anchor', 'middle'], ['fill', '#264653']], null, { text: 'inside', inline: true })])];
  },
  set(k, v) { const m = /^l(\d)$/.exec(k); if (m) { this.langs[+m[1]] = v; this.changed = true; } },
  after() {
    if (this.mode === 'lang') {
      const kids = Array.from(Stage.gArt.querySelectorAll('switch > text'));
      this.shown = kids.findIndex((t) => t.getBoundingClientRect().width > 0);
      const langs = userLangs().join(', ');
      const w = kids[this.shown];
      ctxNote(`Your browser’s languages: <b>${esc(langs)}</b>. The switch is drawing <b>“${esc(w ? w.textContent : 'nothing')}”</b>${this.shown === this.langs.length ? ', the fallback. No tag matched, so try setting one to your exact tag from the list above' : ''}.`);
      return;
    }
    const u = Stage.gArt.querySelector(this.tag === 'g' ? ':scope > g' : 'sparkle'), c = u && u.querySelector('circle');
    const drawn = !!(c && c.getBoundingClientRect().width > 0), kind = u ? Object.prototype.toString.call(u).slice(8, -1) : '?';
    ctxNote(`Your browser made &lt;${this.tag}&gt; an <b>${esc(kind)}</b> and <b>${drawn ? 'drew' : 'did not draw'}</b> what’s inside it.`);
  },
  goals: [
    { label: 'Make it speak your language', test: () => LabSwitch.shown >= 0 && LabSwitch.shown < LabSwitch.langs.length },
    { label: 'Change a language', test: () => LabSwitch.changed },
    { label: 'Meet the unknown tag', test: () => LabSwitch.met },
    { label: 'Rename it to g', test: () => LabSwitch.renamed },
  ],
};

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => App.init());
else App.init();
})();
</script>
</body>
</html>
