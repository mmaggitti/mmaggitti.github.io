--|---|---|---|---|\n| Public Works |  | civil engineering of roads, foundations, water systems and construction serving whole communities | `group:public-works` | §7.1 Civil |\n| Load-Bearing Design |  | the structural engineering of buildings and bridges that must carry gravity, wind and earthquake forces | `group:load-bearing-design` | §7.2 Structural |\n| Machinery & Thermal |  | mechanical engineering of HVAC, refrigeration, power plants, fluid systems and the design of moving parts | `group:machinery-thermal` | §7.3 Mechanical |\n| Electrotechnology |  | power grids, circuits, communications, computing hardware and the instrumentation that automates industrial processes | `group:electrotechnology` | §7.4 Electrical and Computer, and Control Systems |\n| Process Industries |  | chemical plants, pollution control, oil and gas production and atomic power: turning raw materials and fuels into useful output | `group:process-industries` | §7.5 Process and energy |\n| Built Environment & Operations |  | agricultural and biological systems, building systems, fire protection and industrial engineering for farms, buildings and factories | `group:built-environment-operations` | §7.6 Built environment and systems |\n| Resources & Marine |  | metallurgy and materials, mining and mineral processing, and naval architecture for ships and offshore structures | `group:resources-marine` | §7.7 Materials and resources |\n\n## Level 2 · Disciplines (16)\n\n### Public Works → disciplines · `group:public-works`\n\n| Node (answer) | Map cue | Definition (cue) | ID | Official / source |\n|---|---|---|---|---|\n| Civil Engineering |  | engineering of public works and the built environment, examined as one PE exam with five depth modules from foundations to water | `field:civil` | PE Civil (5 modules) · §7.0 |\n\n### Load-Bearing Design → disciplines · `group:load-bearing-design`\n\n| Node (answer) | Map cue | Definition (cue) | ID | Official / source |\n|---|---|---|---|---|\n| Structural Engineering |  | analysing and designing the frames, members, connections and footings of buildings and bridges in steel, concrete, timber and masonry | `field:structural` | PE Structural (4 sections, Apr 2027 specs) · §7.0 |\n\n### Machinery & Thermal → disciplines · `group:machinery-thermal`\n\n| Node (answer) | Map cue | Definition (cue) | ID | Official / source |\n|---|---|---|---|---|\n| Mechanical Engineering |  | the PE discipline covering building climate control, thermal and fluid power plants, and the design of moving devices and their materials | `field:mechanical` | PE Mechanical (3 modules) · §7.0 |\n\n### Electrotechnology → disciplines · `group:electrotechnology`\n\n| Node (answer) | Map cue | Definition (cue) | ID | Official / source |\n|---|---|---|---|---|\n| Electrical and Computer Engineering |  | designing and analysing everything from utility grids and motors to circuits, communications links and digital hardware and software | `field:electrical-computer` | PE Electrical and Computer (3 modules) · §7.0 |\n| Control Systems Engineering |  | instrumenting and automating industrial processes: sensors, valves and drives, loop and logic design, signal wiring and safety shutdown | `field:control-systems` | PE Control Systems · §7.0 |\n\n### Process Industries → disciplines · `group:process-industries`\n\n| Node (answer) | Map cue | Definition (cue) | ID | Official / source |\n|---|---|---|---|---|\n| Chemical Engineering |  | designing and running processes that turn raw feedstocks into products through separations, conversions, heat and fluid handling | `field:chemical` | PE Chemical · §7.0 |\n| Environmental Engineering |  | protecting public health and ecosystems by treating water, air and wastes and cleaning up contaminated sites | `field:environmental` | PE Environmental · §7.0 |\n| Petroleum Engineering |  | drilling, completing and producing oil and gas wells, building surface facilities and managing reservoirs and economics | `field:petro /* mmaggitti.github.io design system — served at /ds/ds.css, specimen at /ds/.
 *
 * Everything that should scale is in rem. The whole UI scales from one knob, --ui-scale, which
 * sets the root font size: at the site default of 0.75, 1rem = 12px. It goes through % of the
 * browser default rather than a px value, so Safari's own text-size setting still applies.
 *
 * px is used only for what must stay physical: hairlines and focus rings (0–3px), and the 44pt
 * tap floor. `npm run check` fails the deploy on any other px outside a `px-ok` line.
 *
 * Token values are written at the 16px design base: 1.0625rem is "17px at 100%".
 */

/* ── Tokens ─────────────────────────────────────────────────────────────── */

:root {
  --ui-scale: 0.75;

  /* Type: 15 / 17 / 22 / 28 / 56 at 100% */
  --text-sm: 0.9375rem;
  --text-md: 1.0625rem;
  --text-lg: 1.375rem;
  --text-xl: 1.75rem;
  --text-display: 3.5rem;
  --leading: 1.45;
  --leading-tight: 1.2;
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  /* Space: 4 / 8 / 12 / 16 / 20 / 24 / 32 / 48 at 100% */
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 1.5rem;
  --space-7: 2rem;
  --space-8: 3rem;

  /* Shape and size */
  --radius-sm: 0.5rem;
  --radius: 0.875rem;
  --control-h: 3.25rem;     /* primary controls: 52 at 100% */
  --control-h-sm: 2.75rem;  /* secondary controls: 44 at 100% */
  --measure: 40rem;         /* content column */
  --tap-min: 44px;          /* px-ok: physical tap floor, never scaled */

  /* Color */
  --bg: #F6F4EE;
  --surface: #FFFFFF;
  --text: #1B1B1B;
  --text-muted: #5E5A52;
  --line: #E3DED3;
  --accent: #233044;
  --on-accent: #FFFFFF;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111111;
    --surface: #1C1C1E;
    --text: #F2F2F2;
    --text-muted: #A5A5AA;
    --line: #2C2C2E;
    --accent: #9DB4D6;
    --on-accent: #111111;
  }
}

/* ── Base ───────────────────────────────────────────────────────────────── */

*, *::before, *::after { box-sizing: border-box; }

html {
  font-size: calc(var(--ui-scale) * 100%);
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: var(--text-md) / var(--leading) var(--font-ui);
}

:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* iOS Safari zooms the whole page into any focused field whose text is under 16px, and at a 75%
   UI scale every rem-sized field is. So fields get a physical 16px floor. */
input, select, textarea { font-size: max(16px, 1em); } /* px-ok: iOS focus-zoom floor */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
  .ds-btn:active { transform: none; }
}

/* ── Layout ─────────────────────────────────────────────────────────────── */

/* svh, never vh: the collapsing address bar makes vh jump mid-scroll. */
.ds-app {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}

.ds-page {
  flex: 1;
  width: 100%;
  max-width: var(--measure);
  margin: 0 auto;
  padding: var(--space-6) var(--space-4);
}

/* ── Text ───────────────────────────────────────────────────────────────── */

.ds-title { font-size: var(--text-xl); line-height: var(--leading-tight); margin: 0 0 var(--space-1); }
.ds-heading { font-size: var(--text-lg); line-height: var(--leading-tight); margin: var(--space-7) 0 var(--space-3); }
.ds-sub { color: var(--text-muted); margin: 0 0 var(--space-5); }
.ds-muted { color: var(--text-muted); }
.ds-small { font-size: var(--text-sm); }
.ds-num { font-variant-numeric: tabular-nums; }
.ds-display {
  font-size: var(--text-display);
  font-weight: 700;
  line-height: var(--leading-tight);
  font-variant-numeric: tabular-nums;
}
.ds-mono { font-family: var(--font-mono); }

/* ── Cards (tappable tiles, e.g. the launcher) ──────────────────────────── */

.ds-cards { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-3); }

.ds-card {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: var(--space-1);
  min-height: max(var(--tap-min), 4rem);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--line);
  color: inherit;
  text-decoration: none;
}
.ds-card:active { background: var(--line); }
.ds-card-title { font-weight: 600; }
.ds-card-text { color: var(--text-muted); font-size: var(--text-sm); }

/* ── List (key/value rows in one card) ──────────────────────────────────── */

.ds-list {
  margin: 0;
  padding: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.ds-row {
  display: flex;
  justify-content: space-between;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-top: 1px solid var(--line);
}
.ds-row:first-child { border-top: 0; }
.ds-row > :first-child { color: var(--text-muted); margin: 0; }
.ds-row > :last-child { margin: 0; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

/* ── Buttons ────────────────────────────────────────────────────────────── */

.ds-btn {
  flex: 1;
  min-height: max(var(--tap-min), var(--control-h));
  padding: 0 var(--space-4);
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  font: inherit;
  font-weight: 600;
  touch-action: manipulation; /* no double-tap zoom delay */
}
